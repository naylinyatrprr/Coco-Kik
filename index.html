<!-- แทรกแทนที่ CSS เดิมใน <style> -->
<style>
.nav-header-wrapper {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 25px;
  width: 100%;
}

/* บรรทัดที่ 1: 4 แท็บหลัก ฟิตเต็มความกว้าง */
.sales-tabs {
  display: flex;
  gap: 8px;
  width: 100%;
}

.sales-tabs .tab-btn {
  flex: 1 1 0px;
  text-align: center;
  padding: 12px 8px;
  font-size: 0.88rem;
  border-radius: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}

/* บรรทัดที่ 2: แท็บ Admin & สรุปภาพรวม */
.admin-tab-group {
  display: flex;
  gap: 10px;
  justify-content: flex-end; /* จัดขวา หรือเปลี่ยนเป็น center ได้ */
  width: 100%;
}

.admin-tab-group .admin-tab-btn {
  padding: 10px 18px;
  border-radius: 12px;
}

@media (max-width: 600px) {
  .sales-tabs {
    flex-wrap: wrap;
  }
  .sales-tabs .tab-btn {
    flex: 1 1 calc(50% - 8px); /* บนมือถือแบ่งเป็น 2x2 เพื่อไม่ให้ตัวหนังสือล้น */
    font-size: 0.8rem;
    padding: 10px 4px;
  }
  .admin-tab-group {
    justify-content: space-between;
  }
  .admin-tab-group .admin-tab-btn {
    flex: 1;
    justify-content: center;
  }
}
</style>

<!-- โครงสร้าง HTML แท็บ (ส่วนใน container) -->
<div class="nav-header-wrapper">
  <!-- บรรทัดบน: 4 แท็บหลัก ฟิตเต็มหน้าจอ -->
  <div class="sales-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'roomTypesTab')">ตัวอย่างห้อง Room Types</button>
    <button class="tab-btn" onclick="switchTab(event, 'unitsTab')">ยูนิตพร้อมขาย Ready to Move!</button>
    <button class="tab-btn" onclick="switchTab(event, 'projectTab')">รายละเอียดโครงการ Project detail</button>
    <button class="tab-btn" onclick="switchTab(event, 'floorplanTab')">แปลนผังชั้น Floor Plan</button>
  </div>

  <!-- บรรทัดล่าง: สรุปภาพรวม & Backlog Admin -->
  <div class="admin-tab-group">
    <button class="admin-tab-btn overview-tab-btn" onclick="switchTab(event, 'overviewTab')">📊 สรุปภาพรวมโครงการ</button>
    <button class="admin-tab-btn" onclick="switchTab(event, 'backlogTab')">🔒 Backlog</button>
  </div>
</div>
